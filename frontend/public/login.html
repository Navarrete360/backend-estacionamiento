<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Car Parking IoT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        h2 { color: #333; margin-bottom: 20px; }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 0.9rem;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 12px;
            padding-right: 40px; 
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box; 
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 20px;
            height: 20px;
            opacity: 0.6;
            transition: opacity 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .toggle-password:hover { opacity: 1; }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn-primary:hover { background-color: #1d4ed8; }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: #4b5563;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-secondary:hover { background-color: #f3f4f6; }

        .form-section { display: none; animation: fadeIn 0.3s; }
        .form-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .eye-icon { width: 20px; height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-box" class="form-section active">
            <h2>Iniciar Sesión</h2>
            
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="ejemplo@correo.com">
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="login-pass" placeholder="••••••••" maxlength="15">
                    <div class="toggle-password" onclick="togglePass('login-pass', this)">
                        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </div>
                </div>
            </div>

            <button class="btn-primary" onclick="login()">Ingresar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const BACKEND_URL = "https://backend-estacionamiento.vercel.app";

        // --- INICIAR SESIÓN CON BACKEND FASTAPI ---
        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;

            // Validación de campos vacíos
            if (!email || !password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Campos vacíos',
                    text: 'Por favor, ingrese sus credenciales.',
                    confirmButtonColor: '#0d6efd'
                });
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Guardamos el token y el rol de forma segura
                    localStorage.setItem('jwt_token', data.access_token);
                    localStorage.setItem('user_role', data.role || (email.includes('admin') ? 'admin' : 'operario'));
                    
                    // Redirigimos al panel de control
                    window.location.href = "index.html";
                } else {
                    // Contraseña o usuario incorrecto
                    Swal.fire({
                        icon: 'error',
                        title: 'Acceso Denegado',
                        text: 'El correo o la contraseña son incorrectos.',
                        confirmButtonColor: '#0d6efd'
                    });
                }
            } catch (error) {
                // Servidor caído o sin internet
                Swal.fire({
                    icon: 'error',
                    title: 'Error de conexión',
                    text: 'No se pudo conectar con el servidor. Verifique que el Backend esté activo en Railway.',
                    confirmButtonColor: '#0d6efd'
                });
            }
        }
    </script>
</body>
</html>
